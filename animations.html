<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Animations</title>
    <link rel="stylesheet" href="style.css">

<body>
<nav aria-label="Main navigation">

<main>
    <h1>Animations</h1>
    <section>
        <h2>Task 8 - Basic Animation</h2>
        <div class="animation-area"><div class="box" id="basicBox"></div></div>
        <button id="basicBtn">Start Animation</button>
        <button class="reset-btn" data-box="basicBox">Reset</button>
    </section>
    <section>
        <h2>Task 9 - Sequential Animations</h2>
        <div class="animation-area"><div class="box" id="sequenceBox"></div></div>
        <button id="sequenceBtn">Start Animation</button>
        <button class="reset-btn" data-box="sequenceBox">Reset</button>
    </section>
    <section>
        <h2>Task 10 - Combined Animation</h2>
        <div class="animation-area"><div class="box" id="combinedBox"></div></div>
        <button id="combinedBtn">Start Animation</button>
        <button class="reset-btn" data-box="combinedBox">Reset</button>
    </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
